<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A.U.R.O.R.A</title>
  <style>
    @import url('https://fonts.cdnfonts.com/css/gilroy-bold');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #000000;
      font-family: 'Gilroy-Thin', 'Gilroy', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }

    .splash-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
      width: 100%;
      max-width: 500px;
    }

    /* Logotipo Centrado */
    .logo-container {
      width: 210px;
      height: 210px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .logo-img {
      width: 195px;
      height: 195px;
      object-fit: contain;
      animation: fadeIn 0.6s ease-out forwards;
    }

    /* Título A.U.R.O.R.A en Gilroy Thin */
    .title {
      font-family: 'Gilroy-Thin', 'Gilroy', sans-serif;
      font-size: 2.8rem;
      font-weight: 100;
      font-style: normal;
      letter-spacing: 0.28em;
      margin: 0 0 0.4rem 0.28em;
      color: #000000;
      text-transform: uppercase;
      line-height: 1.1;
      animation: fadeIn 0.8s ease-out 0.15s forwards;
    }

    /* Subtítulo con acrónimo en Gilroy Thin y negritas */
    .subtitle {
      font-family: 'Gilroy-Light', 'Gilroy', sans-serif; font-weight: 300;
      font-size: 0.95rem;
      font-weight: 200;
      color: #111111;
      margin: 0 0 2.2rem 0;
      letter-spacing: 0.01em;
      line-height: 1.4;
      white-space: nowrap;
      animation: fadeIn 0.8s ease-out 0.25s forwards;
    }

    .subtitle b {
      font-family: 'Gilroy-ExtraBold', 'Gilroy-Bold', 'Gilroy', sans-serif; font-weight: 800;
      font-weight: 800;
      color: #000000;
    }

    /* Barra de progreso e Iniciando... */
    .progress-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      width: 100%;
      animation: fadeIn 0.8s ease-out 0.35s forwards;
    }

    .status-text {
      font-family: 'Gilroy-Medium', 'Gilroy', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      color: #555555;
      margin: 0;
      letter-spacing: 0.03em;
    }

    .loader-track {
      width: 160px;
      height: 3.5px;
      background: #f1f5f9;
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }

    .loader-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: #000000;
      border-radius: 99px;
      animation: slideLoader 1.6s infinite ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes slideLoader {
      0% {
        left: -40%;
        width: 30%;
      }
      50% {
        left: 30%;
        width: 50%;
      }
      100% {
        left: 100%;
        width: 30%;
      }
    }
  </style>
</head>
